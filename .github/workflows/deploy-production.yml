name: Deploy to Production
  
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  
jobs:
  deploy-production:
    name: Deploy production
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & tag docker image
        uses: AplinkosMinisterija/reusable-workflows/.github/actions/docker-build-tag-push@main
        with:
          environment: production
          push: true
          build-args: |
            VITE_HOST=https://smalsuolis.lt
            VITE_GA_ENV=production
            VITE_SENTRY_ENV=production
            VITE_MAPS_HOST=https://maps.biip.lt

      - name: Trigger deploy
        uses: AplinkosMinisterija/reusable-workflows/.github/actions/trigger-workflow-and-wait@main
        with:
          application-id: ${{ secrets.SMALSUOLIS_TRIGGER_DEPLOY_APPLICATION_ID }}
          application-private-key: ${{ secrets.SMALSUOLIS_TRIGGER_DEPLOY_APPLICATION_PRIVATE_KEY }}
          repository: ${{ secrets.SMALSUOLIS_TRIGGER_DEPLOY_REPOSITORY }}
          workflow-file-name: ${{ secrets.SMALSUOLIS_TRIGGER_DEPLOY_WORKFLOW_FILE_NAME }}
          workflow-payload: '{"environment": "production"}'
          